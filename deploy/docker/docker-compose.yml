# ==============================================================================
# BoxFox Agent Box — chạy sandbox container
#
# QUY TẮC ②a (7.4.1): box khởi động với data plane ĐÓNG (iptables OUTPUT DROP,
# xem box-firewall). Port 5900/6080/8080 vẫn truy cập được từ host vì đó là
# kết nối VÀO (conntrack ESTABLISHED cho phép trả lời).
#
# CÔNG TẮC MẠNG ②b (7.4.1) = box-firewall trong box (iptables), không cần restart:
#   BẬT : POST /__box/network  body "on"  (backend giữ X-BoxFox-Api-Key, proxy chạy root)
#   TẮT : POST /__box/network  body "off"
#   Thủ công để gỡ lỗi: docker exec --user root agentbox-box box-firewall on|off
#
# Ghi chú: entrypoint chạy root chỉ để cấu hình firewall rồi gosu hạ xuống
# `agent` — mọi tiến trình làm việc đều non-root (quy tắc ⑥).
# ==============================================================================
services:
  box:
    build: .
    image: agentbox-sandbox:latest
    container_name: agentbox-box
    hostname: box
    user: "0"             # entrypoint cần root để set iptables, tự hạ quyền sau
    cap_add:
      - NET_ADMIN         # chỉ để box-firewall đổi luật iptables
    # W6.1.3 — verify_exec (reviewer chạy thử một đoạn python/node trong hộp kín bubblewrap):
    # bubblewrap cần tạo user namespace, nhưng profile mặc định của Docker chặn việc này —
    # đo trong container: "No permissions to create new namespace". Hai dòng dưới mở đúng
    # đường đó cho container `box` (đã đo: bwrap chạy được).
    # ĐÁNH ĐỔI có ý thức: container `box` mất lớp lọc syscall mặc định của Docker và lớp
    # AppArmor. Box vẫn giữ namespace + quyền hạ xuống `agent` + box-firewall. Muốn quay lại
    # mặc định an toàn hơn: xoá 2 dòng này — verify_exec tự báo VERIFY_EXEC_UNAVAILABLE
    # (fail closed, không có đường chạy không cách ly).
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      # Quy tắc ②a: mặc định TẮT — người dùng bật bằng nút trên giao diện
      # (endpoint /__box/network của ide-proxy, mục 12.3.1)
      BOX_DEFAULT_NETWORK: "off"
      # Điện mặc định BẬT lúc boot; tắt/bật bằng nút Máy (/__box/power)
      BOX_DEFAULT_POWER: "on"
      # Shared secret cho mọi endpoint điều khiển cần quyền: /__box/network,
      # /__box/power, /__box/capture, /__box/record/*.
      # Giao diện web (:3100) và backend gửi header X-BoxFox-Api-Key = giá trị này.
      # GIÁ TRỊ MẶC ĐỊNH ĐÃ COMMIT để ai clone về `docker compose up -d` là chạy
      # được ngay (token giữa frontend/box trên cùng một máy — KHÔNG phải khóa API
      # của nhà cung cấp, vốn phải để riêng ở .env sau này). Muốn đổi token riêng:
      # đặt BOXFOX_API_KEY trong .env cùng thư mục (xem .env.example) và đồng bộ
      # VITE_BOX_API_KEY phía frontend. Bỏ trống (= "") thì fail-closed với
      # network/power: không ai bật/tắt được.
      BOXFOX_API_KEY: "${BOXFOX_API_KEY:-boxfox-local-dev-token}"
      # CẦU NỐI LLM (opt-in, MẶC ĐỊNH TẮT): mở egress TCP tới router BoxFox để
      # Claude Code trong box chạy được `/claude-code` mà không cần tài khoản
      # Anthropic. Bật bằng BOX_LLM_BRIDGE=on trong .env cùng thư mục; địa chỉ
      # mặc định là gateway mặc định của container (172.18.0.1), cổng 3101.
      # Đọc kỹ phần rủi ro trong deploy/docker/README-claude-code.md trước khi bật.
      BOX_LLM_BRIDGE: "${BOX_LLM_BRIDGE:-off}"
      BOX_LLM_BRIDGE_HOST: "${BOX_LLM_BRIDGE_HOST:-}"
      BOX_LLM_BRIDGE_PORT: "${BOX_LLM_BRIDGE_PORT:-3101}"
    networks:
      - boxnet
    ports:
      # Quy tắc 12.6 — chỉ bind loopback. Xvnc chạy -SecurityTypes None và code-server chạy
      # --auth none, nên nếu publish ra 0.0.0.0 thì mọi máy trong LAN đều điều
      # khiển được box. Người dùng xem box từ trình duyệt trên chính máy host.
      - "127.0.0.1:5900:5900"   # VNC — người dùng xem màn hình box (VNC Viewer)
      - "127.0.0.1:6080:6080"   # websockify — cầu WebSocket cho noVNC trong frontend
      - "127.0.0.1:8080:8080"   # code-server — VS Code web (truy cập trực tiếp)
      - "127.0.0.1:8081:8081"   # ide‑proxy — code‑server + CSP frame‑ancestors
    volumes:
      # Workspace nằm ngoài vòng đời container: xóa container, giữ workspace (mục 7.6)
      - agentbox-workspace:/home/agent/workspace
      - ../../backend/src/agentbox/vendor/hermes:/opt/boxfox-skills:ro
    restart: unless-stopped

networks:
  # Quy tắc ②a — KHÔNG dùng internal:true vì nó làm hỏng published ports.
  # NAT do Docker quản (mặc định): chính sách egress thực sự nằm Ở TRONG box
  # qua box-firewall (iptables OUTPUT DROP/ACCEPT) — công tắc ②b. Bỏ dùng
  # driver_opts enable_ip_masquerade:false vì nó không nhất quán (Docker Desktop
  # bỏ qua cờ này) và làm Linux không ra mạng dù bật box-firewall.
  boxnet:
    driver: bridge

volumes:
  agentbox-workspace:
